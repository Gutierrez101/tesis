worker_processes auto;
rtmp_auto_push on;
events {}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;
            # Opciones para minimizar la latencia hacia OpenCV
            wait_key on;
            wait_video on;
        }
    }
}

http {
    server {
        listen 80;
        location / {
            return 200 "Servidor Nginx RTMP activo\n";
        }
    }
}